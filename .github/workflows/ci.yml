name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.15'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
        working-directory: backend
      - run: uv run --locked ruff check src tests ../scripts
        working-directory: backend
      - run: uv run --locked ruff format --check src tests ../scripts
        working-directory: backend
      - run: uv run --locked mypy src
        working-directory: backend
      - run: uv run --locked python ../scripts/generate_contracts.py --check
        working-directory: backend
      - run: uv run --locked pytest -q -ra
        working-directory: backend

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.15'
          python-version: '3.12'
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
