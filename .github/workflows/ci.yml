name: Product and release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.15'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
        working-directory: backend
      - run: uv run --locked ruff check src tests ../scripts
        working-directory: backend
      - run: uv run --locked ruff format --check src tests ../scripts
        working-directory: backend
      - run: uv run --locked mypy src
        working-directory: backend
      - run: uv run --locked python ../scripts/generate_contracts.py --check
        working-directory: backend
      - run: uv run --locked pytest -q -ra
        working-directory: backend
        env:
          AGENTS_IDE_LOAD_REPORT: ../stage12-load-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-${{ matrix.os }}-${{ matrix.python }}
          path: stage12-load-report.json
          if-no-files-found: ignore

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.15'
          python-version: '3.12'
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: backend/.venv/Scripts/python.exe scripts/build_release.py --output .local/agents-ide-release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agents-ide-release
          path: |
            .local/agents-ide-release.zip
            .local/stage12-browser-load.json
          include-hidden-files: true
